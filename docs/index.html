<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<meta name="color-scheme" content="dark">
<title>Crunching</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root {
    --bg: #0b0d10; --fg: #e8eaed; --accent: #4cc2ff; --good: #3ddc84; --bad: #ff5c5c; --warn: #ffb84d;
    --muted: #8b929c; --panel: #14181e; --panel2: #1b2028; --line: #262c35;
    --mono: ui-monospace, "Roboto Mono", monospace;
    --tabh: 64px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body { font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; min-height: 100vh; overflow-x: hidden; }
  button { font: inherit; color: inherit; touch-action: manipulation; cursor: pointer; }
  h1 { font-size: 22px; margin: 4px 0 12px; }
  h2 { font-size: 18px; margin: 0; }
  h3 { font-size: 15px; margin: 20px 0 8px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .num, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); }
  .good { color: var(--good); } .bad { color: var(--bad); } .warn { color: var(--warn); } .accent { color: var(--accent); }

  #main { max-width: 920px; margin: 0 auto; padding: 12px 12px calc(var(--tabh) + 24px + env(safe-area-inset-bottom)); }
  body.in-session #main { padding-bottom: 24px; }
  #tabs { position: fixed; left: 0; right: 0; bottom: 0; display: flex; background: #0e1116; border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom); z-index: 10; }
  #tabs[hidden] { display: none; }
  #tabs button { flex: 1; min-height: var(--tabh); background: none; border: 0; color: var(--muted); font-weight: 600; font-size: 15px; }
  #tabs button.on { color: var(--accent); box-shadow: inset 0 2px 0 var(--accent); }

  .top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 8px; }
  .top .stats { display: flex; gap: 16px; color: var(--muted); font-size: 14px; }
  .top .stats b { color: var(--fg); }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  .card.soon { opacity: .55; }
  .card-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .card p { margin: 6px 0 10px; color: var(--muted); font-size: 14px; }
  .lvl { font-family: var(--mono); font-weight: 700; color: var(--accent); background: var(--panel2); border-radius: 8px; padding: 2px 10px; }
  .row-stats { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; font-size: 14px; color: var(--muted); margin-bottom: 12px; }
  .row-stats b { color: var(--fg); }
  .badge { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; border: 1px solid currentColor; }
  .b-Calibrating { color: var(--muted); } .b-Advance { color: var(--good); } .b-Hold { color: var(--warn); } .b-Drill { color: var(--bad); }

  .btn { display: block; width: 100%; min-height: 52px; border: 0; border-radius: 12px; background: var(--accent); color: #04121b;
    font-weight: 700; font-size: 17px; padding: 10px 16px; }
  .btn:active { filter: brightness(.9); }
  .btn.ghost { background: var(--panel2); color: var(--fg); border: 1px solid var(--line); }
  .btn.danger { background: var(--bad); color: #1a0505; }
  .btn.sm { display: inline-block; width: auto; min-height: 44px; font-size: 15px; padding: 6px 16px; }
  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }

  .sbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; }
  .flash-h { display: flex; justify-content: space-between; align-items: baseline; font-weight: 600; margin: 4px 0 6px; font-size: 15px; }
  .timer { display: flex; align-items: center; gap: 10px; margin: 6px 0 12px; }
  .timer .bar { flex: 1; height: 8px; background: var(--panel2); border-radius: 4px; overflow: hidden; }
  .timer .bar i { display: block; height: 100%; background: var(--accent); transform-origin: left center; }
  .timer.low .bar i { background: var(--warn); }
  .timer .secs { min-width: 4.2ch; text-align: right; font-size: 15px; }

  /* P&L table */
  .plwrap { overflow-x: auto; margin: 0 -4px; }
  table.pl { width: 100%; border-collapse: collapse; font-size: clamp(11px, 2.8vw, 15px); }
  table.pl th, table.pl td { padding: 4px 3px; white-space: nowrap; border-bottom: 1px solid #171b21; }
  table.pl thead th { color: var(--muted); font-weight: 600; text-align: right; font-size: .92em; border-bottom: 1px solid var(--line); }
  table.pl tbody th { text-align: left; font-weight: 500; }
  table.pl td { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
  table.pl td.py { color: var(--muted); }
  table.pl tr.sub th, table.pl tr.sub td { font-weight: 700; }
  table.pl tr.div td { padding: 0; height: 10px; border-bottom: 1px solid var(--line); }
  table.pl tr.hl th, table.pl tr.hl td { background: rgba(255, 184, 77, .14); }
  table.pl tr.hl th { box-shadow: inset 3px 0 0 var(--warn); padding-left: 6px; }
  @media (orientation: landscape) and (min-width: 640px) {
    table.pl { font-size: 15px; }
    table.pl th, table.pl td { padding: 5px 10px; }
  }

  .prompt { font-size: 19px; line-height: 1.4; margin: 6px 0 14px; }
  .unit-hint { font-size: 14px; color: var(--muted); margin: -6px 0 10px; }
  .opts { display: grid; gap: 10px; }
  .opt { min-height: 56px; text-align: left; padding: 12px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; font-size: 16px; }
  .opt:active { background: var(--panel2); }

  /* keypad */
  .kp-disp { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; text-align: right;
    font-size: 30px; min-height: 60px; display: flex; justify-content: flex-end; align-items: baseline; gap: 10px; }
  .kp-disp .u { font-size: 18px; color: var(--accent); }
  .chips { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin: 10px 0; }
  .chip { min-height: 48px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); font-family: var(--mono); font-size: 15px; }
  .chip.on { border-color: var(--accent); color: var(--accent); background: rgba(76, 194, 255, .12); font-weight: 700; }
  .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .key { min-height: 58px; border-radius: 12px; border: 0; background: var(--panel2); font-family: var(--mono); font-size: 24px; }
  .key:active { background: #2a313b; }
  .key.wide { grid-column: span 2; }
  .key.submit { background: var(--accent); color: #04121b; font-family: inherit; font-weight: 700; font-size: 19px; }
  @media (orientation: landscape) and (max-height: 500px) {
    .qa-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
    .key { min-height: 48px; }
  }

  /* reveal / feedback */
  .diag p { background: var(--panel); border-left: 3px solid var(--warn); border-radius: 8px; padding: 10px 12px; margin: 10px 0; font-size: 15px; }
  .ans { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin: 8px 0; font-size: 15px; }
  .ans .q { color: var(--muted); font-size: 13px; margin-bottom: 4px; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; align-items: baseline; }
  .kv b { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .verdict { font-size: 26px; font-weight: 800; margin: 6px 0 12px; }
  .steps { margin: 6px 0 0; padding-left: 22px; font-family: var(--mono); font-size: 15px; line-height: 1.7; }
  .big { font-size: 28px; font-weight: 800; }

  /* generic tables */
  table.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.tbl th, table.tbl td { padding: 8px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  table.tbl th { color: var(--muted); font-weight: 600; text-align: right; }
  table.tbl th:first-child, table.tbl td:first-child { text-align: left; }
  table.tbl td { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
  table.tbl td.l { font-family: inherit; }
  .empty { color: var(--muted); font-size: 14px; padding: 8px 0; }
  .note { font-size: 13px; color: var(--muted); margin-top: 8px; }
  input[type=file] { display: none; }
</style>
</head>
<body>
<main id="main"></main>
<nav id="tabs">
  <button data-tab="train" class="on">Train</button>
  <button data-tab="progress">Progress</button>
  <button data-tab="settings">Settings</button>
</nav>
<script src="version.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
